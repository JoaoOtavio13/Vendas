{% extends 'html/base.html' %}

{% block title %}E-mail Enviado - Atacadão do João{% endblock %}

{% block content %}
<section class="showcase">
    <div class="page-title">E-mail Enviado!</div>
    <div style="max-width: 500px; margin: 0 auto;">
        <article class="showcard">
            <div class="showcard-body">
                <p style="color: var(--muted);">
                    Enviamos um link para redefinição de senha para o seu e-mail.
                    Verifique sua caixa de entrada (e a pasta de spam).
                </p>
                <p style="margin-top: 16px;">
                    <a href="{% url 'login' %}" class="btn">Voltar ao login</a>
                </p>
            </div>
        </article>
    </div>
</section>
{% endblock %}
