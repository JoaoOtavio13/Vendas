{% extends 'html/base.html' %}

{% block title %}Nova Senha - Atacadão do João{% endblock %}

{% block content %}
<section class="showcase">
    <div class="page-title">Definir Nova Senha</div>
    <div style="max-width: 400px; margin: 0 auto;">
        <article class="showcard">
            <div class="showcard-body">
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        <p>
                            <label for="id_new_password1">Nova senha</label><br>
                            <span class="password-wrapper">
                                <input type="password" name="new_password1" id="id_new_password1" required
                                       style="width: 100%; padding: 8px; margin-top: 5px;">
                                <button type="button" class="password-toggle"
                                        onclick="togglePassword('id_new_password1', this)" tabindex="-1"
                                        aria-label="Mostrar/ocultar senha">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </span>
                        </p>
                        <p>
                            <label for="id_new_password2">Confirmar nova senha</label><br>
                            <span class="password-wrapper">
                                <input type="password" name="new_password2" id="id_new_password2" required
                                       style="width: 100%; padding: 8px; margin-top: 5px;">
                                <button type="button" class="password-toggle"
                                        onclick="togglePassword('id_new_password2', this)" tabindex="-1"
                                        aria-label="Mostrar/ocultar senha">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </span>
                        </p>
                        <p style="text-align: center; margin-top: 20px;">
                            <button class="btn" type="submit">Redefinir senha</button>
                        </p>
                    </form>
                {% else %}
                    <p style="color: #dc3545; font-weight: 500;">
                        Este link de redefinição é inválido ou já expirou.
                    </p>
                    <p style="margin-top: 16px;">
                        <a href="{% url 'password_reset' %}" class="btn">Solicitar novo link</a>
                    </p>
                {% endif %}
            </div>
        </article>
    </div>
</section>
{% endblock %}
