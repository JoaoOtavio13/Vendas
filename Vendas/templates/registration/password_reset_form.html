{% extends 'html/base.html' %}

{% block title %}Redefinir Senha - Atacadão do João{% endblock %}

{% block content %}
<section class="showcase">
    <div class="page-title">Redefinir Senha</div>
    <div style="max-width: 400px; margin: 0 auto;">
        <article class="showcard">
            <div class="showcard-body">
                <p style="color: var(--muted); margin-bottom: 16px;">
                    Digite seu e-mail cadastrado e enviaremos um link para redefinir sua senha.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <p>
                        <label for="id_email">E-mail</label><br>
                        <input type="email" name="email" id="id_email" required
                               style="width: 100%; padding: 8px; margin-top: 5px;">
                    </p>
                    <p style="text-align: center; margin-top: 20px;">
                        <button class="btn" type="submit">Enviar link</button>
                    </p>
                </form>
                <p style="text-align: center; margin-top: 12px;">
                    <a href="{% url 'login' %}" style="color: var(--accent);">Voltar ao login</a>
                </p>
            </div>
        </article>
    </div>
</section>
{% endblock %}
