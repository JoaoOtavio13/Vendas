{% extends 'html/base.html' %}

{% block title %}Editar Venda - Atacadão do João{% endblock %}

{% block content %}
    <div class="page-title">Adicionar item na Venda #{{ venda.id }}</div>
    <div class="card">
        <p class="meta">Cliente: {{ venda.usuario_id.nome|default:venda.usuario_id.username }}</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn" type="submit">Adicionar item</button>
        </form>
    </div>
{% endblock %}
