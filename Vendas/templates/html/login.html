{% extends 'html/base.html' %}

{% block title %}Login - Atacadão do João{% endblock %}

{% block content %}
    <section class="showcase">
        <div class="page-title">Login</div>
        <div style="max-width: 400px; margin: 0 auto;">
            <article class="showcard">
                <div class="showcard-body">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <p>
                            <label for="username">Usuário</label><br>
                            <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
                        </p>
                        <p>
                            <label for="password">Senha</label><br>
                            <span class="password-wrapper">
                                <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
                                <button type="button" class="password-toggle" onclick="togglePassword('password', this)" tabindex="-1" aria-label="Mostrar/ocultar senha">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </span>
                        </p>
                        <p style="text-align: center; margin-top: 20px;">
                            <button class="btn" type="submit">Entrar</button>
                        </p>
                    </form>
                </div>
            </article>
        </div>
    </section>
{% endblock %}
