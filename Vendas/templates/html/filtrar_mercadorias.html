{% extends 'html/base.html' %}

{% block title %}Filtrar Mercadorias - Atacadão do João{% endblock %}

{% block content %}
    <h1>Filtrar Mercadorias</h1>
    <form method="get">
        {{ form.as_p }}
        <button type="submit">Filtrar</button>
    </form>
    {% for m in mercadorias %}
        <div>{{ m.nome }}</div>
    {% empty %}
        <p>Nenhuma mercadoria encontrada.</p>
    {% endfor %}
{% endblock %}
