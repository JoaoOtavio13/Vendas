{% extends 'html/base.html' %}

{% block title %}Filtrar Categorias - Atacadão do João{% endblock %}

{% block content %}
    <section class="showcase">
        <div class="page-title">Filtrar Categorias</div>
        <div style="max-width: 500px; margin: 0 auto;">
            <article class="showcard">
                <div class="showcard-body">
                    <form method="get">
                        {{ form.as_p }}
                        <p style="text-align: center; margin-top: 20px;">
                            <button class="btn" type="submit">Filtrar</button>
                        </p>
                    </form>
                </div>
            </article>
        </div>

        <div class="page-title" style="margin-top: 30px;">Resultados</div>
        <div class="cards-row">
            {% for c in categorias %}
                <a href="{% url 'mercadorias' c.id %}" class="showcard-link">
                    <article class="showcard">
                        <div class="showcard-body">
                            <h2>{{ c.nome }}</h2>
                            <p>{{ c.descricao }}</p>
                        </div>
                    </article>
                </a>
            {% empty %}
                <article class="showcard">
                    <div class="showcard-body">
                        <h2>Nenhuma categoria encontrada</h2>
                    </div>
                </article>
            {% endfor %}
        </div>
    </section>
{% endblock %}
