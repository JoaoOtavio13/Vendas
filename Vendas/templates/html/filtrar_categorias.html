{% extends 'html/base.html' %}

{% block title %}Filtrar Categorias - Atacadão do João{% endblock %}

{% block content %}
    <h1>Filtrar Categorias</h1>
    <form method="get">
        {{ form.as_p }}
        <button type="submit">Filtrar</button>
    </form>
    {% for c in categorias %}
        <div>{{ c.nome }}</div>
    {% empty %}
        <p>Nenhuma categoria encontrada.</p>
    {% endfor %}
{% endblock %}
