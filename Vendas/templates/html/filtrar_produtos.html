{% extends 'html/base.html' %}

{% block title %}Filtrar Produtos - Atacadão do João{% endblock %}

{% block content %}
    <h1>Filtrar Produtos</h1>
    <form method="get">
        {{ form.as_p }}
        <button type="submit">Filtrar</button>
    </form>
    {% for p in produtos %}
        <div>{{ p.nome }}</div>
    {% empty %}
        <p>Nenhum produto encontrado.</p>
    {% endfor %}
{% endblock %}
