<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Filtrar Produtos</title>
</head>
<body>
    <h1>Filtrar Produtos</h1>
    <form method="get">
        {{ form.as_p }}
        <button type="submit">Filtrar</button>
    </form>
    {% for p in produtos %}
        <div>{{ p.nome }}</div>
    {% empty %}
        <p>Nenhum produto encontrado.</p>
    {% endfor %}
</body>
</html>
